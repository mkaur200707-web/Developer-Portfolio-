<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Portfolio | Aanya Sharma</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <a href="#home" class="logo">&lt;Dev<span>/&gt;</span></a>

    <nav class="nav-links" id="navLinks">
        <a href="#home" class="active">Home</a>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#education">Education</a>
        <a href="#projects">Projects</a>
        <a href="#certificates">Certificates</a>
        <a href="#contact">Contact</a>
    </nav>

    <button class="menu-btn" id="menuBtn">☰</button>
</header>

<main>
    <section class="hero" id="home">

        <div class="gradient-orb orb-one"></div>
        <div class="gradient-orb orb-two"></div>

        <div class="hero-content">
            <p class="hello">HELLO, I'M</p>

            <h1>Aanya <span>Sharma</span></h1>

            <h2>
                I'm a <span id="typingText"></span><span class="cursor">|</span>
            </h2>

            <p class="hero-description">
                I create modern, responsive and user-friendly digital
                experiences by combining creativity, clean design and technology.
            </p>

            <div class="hero-buttons">
                <a href="#projects" class="btn primary-btn">
                    Explore My Work <span>↗</span>
                </a>

                <a href="#contact" class="btn secondary-btn">
                    Let's Connect
                </a>
            </div>

            <div class="social-area">
                <span>Find me on</span>

                <div class="social-links">
                    <a href="#">GH</a>
                    <a href="#">in</a>
                    <a href="#">@</a>
                </div>
            </div>

        </div>

        <!-- Simple Profile Picture -->

        <div class="hero-visual">

            <div class="profile-circle">
                <img
                    src="https://img.magnific.com/premium-photo/indian-businesswoman-white-background-showing-left-side-with-her-right-hand_181624-58573.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="Aanya Sharma"
                    style="width:100%;height:100%;object-fit:cover;display:block;"
                >
            </div>

        </div>

    </section>
</main>

<script src="script.js"></script>

</body>
</html>
